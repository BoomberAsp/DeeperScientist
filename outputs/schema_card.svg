<svg xmlns="http://www.w3.org/2000/svg" width="420" height="520" font-family="JetBrains Mono, Consolas, monospace">
  <!-- Card background -->
  <rect x="0" y="0" width="420" height="520" rx="8" fill="#ffffff"/>
  <rect x="0" y="0" width="420" height="520" rx="8" fill="none" stroke="#d0d5dd" stroke-width="1.5"/>

  <!-- Card title -->
  <text x="20" y="36" font-size="13" fill="#2563eb" font-weight="bold">Evidence Record Schema</text>
  <line x1="20" y1="46" x2="400" y2="46" stroke="#e2e8f0" stroke-width="1"/>

  <!-- YAML frontmatter -->
  <text x="20" y="72" font-size="11" fill="#94a3b8">---</text>
  <text x="20" y="96" font-size="11" fill="#b45309">evidence_id:</text><text x="150" y="96" font-size="11" fill="#92400e">EVD-0c8841da-001</text>
  <text x="20" y="120" font-size="11" fill="#b45309">title:</text><text x="150" y="120" font-size="11" fill="#92400e">Demo accuracy evidence</text>
  <text x="20" y="144" font-size="11" fill="#b45309">claim:</text><text x="150" y="144" font-size="11" fill="#92400e">The model reaches 93.2% accuracy.</text>
  <text x="20" y="168" font-size="11" fill="#b45309">evidence_level:</text><text x="150" y="168" font-size="11" fill="#16a34a">supported</text>
  <text x="20" y="192" font-size="11" fill="#b45309">source_type:</text><text x="150" y="192" font-size="11" fill="#92400e">experiment_result</text>
  <text x="20" y="216" font-size="11" fill="#b45309">source_location:</text><text x="150" y="216" font-size="11" fill="#92400e">manual demo result</text>
  <text x="20" y="240" font-size="11" fill="#b45309">source_excerpt:</text><text x="150" y="240" font-size="11" fill="#92400e">"The model reaches 93.2%</text>
  <text x="160" y="256" font-size="11" fill="#92400e">  accuracy."</text>
  <text x="20" y="280" font-size="11" fill="#b45309">claim_relation:</text><text x="150" y="280" font-size="11" fill="#92400e">Directly supports the claim.</text>
  <text x="20" y="304" font-size="11" fill="#b45309">timestamp:</text><text x="150" y="304" font-size="11" fill="#92400e">2026-06-02T11:30:48+00:00</text>
  <text x="20" y="328" font-size="11" fill="#94a3b8">---</text>

  <!-- Divider -->
  <rect x="20" y="340" width="380" height="1" fill="#e2e8f0"/>

  <!-- Field annotations -->
  <text x="20" y="368" font-size="10" fill="#2563eb" font-weight="bold">evidence_level</text>
  <text x="20" y="384" font-size="9" fill="#64748b">supported | inferred | insufficient | retracted</text>

  <text x="20" y="408" font-size="10" fill="#2563eb" font-weight="bold">source_type</text>
  <text x="20" y="424" font-size="9" fill="#64748b">arxiv | pdf | url | code_output | tool_call |</text>
  <text x="20" y="438" font-size="9" fill="#64748b">bash_log | memory_card | user_upload |</text>
  <text x="20" y="452" font-size="9" fill="#64748b">experiment_result | dataset | literature_review</text>

  <text x="20" y="476" font-size="10" fill="#b45309" font-weight="bold">source_excerpt</text>
  <text x="20" y="492" font-size="9" fill="#dc2626">REQUIRED for supported &amp; inferred levels</text>
  <text x="20" y="506" font-size="9" fill="#64748b">Enables independent NLI fact-checking</text>
</svg>
