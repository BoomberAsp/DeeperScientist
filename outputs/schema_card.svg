<svg xmlns="http://www.w3.org/2000/svg" width="420" height="520" font-family="JetBrains Mono, Consolas, monospace">
  <!-- Card background -->
  <rect x="0" y="0" width="420" height="520" rx="8" fill="#1e1e2e"/>
  <rect x="0" y="0" width="420" height="520" rx="8" fill="none" stroke="#44475a" stroke-width="1.5"/>

  <!-- Card title -->
  <text x="20" y="36" font-size="13" fill="#8be9fd" font-weight="bold">Evidence Record Schema</text>
  <line x1="20" y1="46" x2="400" y2="46" stroke="#44475a" stroke-width="1"/>

  <!-- YAML frontmatter -->
  <text x="20" y="72" font-size="11" fill="#6272a4">---</text>
  <text x="20" y="96" font-size="11" fill="#ff79c6">evidence_id:</text><text x="150" y="96" font-size="11" fill="#f1fa8c">EVD-0c8841da-001</text>
  <text x="20" y="120" font-size="11" fill="#ff79c6">title:</text><text x="150" y="120" font-size="11" fill="#f1fa8c">Demo accuracy evidence</text>
  <text x="20" y="144" font-size="11" fill="#ff79c6">claim:</text><text x="150" y="144" font-size="11" fill="#f1fa8c">The model reaches 93.2% accuracy.</text>
  <text x="20" y="168" font-size="11" fill="#ff79c6">evidence_level:</text><text x="150" y="168" font-size="11" fill="#50fa7b">supported</text>
  <text x="20" y="192" font-size="11" fill="#ff79c6">source_type:</text><text x="150" y="192" font-size="11" fill="#f1fa8c">experiment_result</text>
  <text x="20" y="216" font-size="11" fill="#ff79c6">source_location:</text><text x="150" y="216" font-size="11" fill="#f1fa8c">manual demo result</text>
  <text x="20" y="240" font-size="11" fill="#ff79c6">source_excerpt:</text><text x="150" y="240" font-size="11" fill="#f1fa8c">"The model reaches 93.2%</text>
  <text x="160" y="256" font-size="11" fill="#f1fa8c">  accuracy."</text>
  <text x="20" y="280" font-size="11" fill="#ff79c6">claim_relation:</text><text x="150" y="280" font-size="11" fill="#f1fa8c">Directly supports the claim.</text>
  <text x="20" y="304" font-size="11" fill="#ff79c6">timestamp:</text><text x="150" y="304" font-size="11" fill="#f1fa8c">2026-06-02T11:30:48+00:00</text>
  <text x="20" y="328" font-size="11" fill="#6272a4">---</text>

  <!-- Divider -->
  <rect x="20" y="340" width="380" height="1" fill="#44475a"/>

  <!-- Field annotations -->
  <text x="20" y="368" font-size="10" fill="#8be9fd" font-weight="bold">evidence_level</text>
  <text x="20" y="384" font-size="9" fill="#6272a4">supported | inferred | insufficient | retracted</text>

  <text x="20" y="408" font-size="10" fill="#8be9fd" font-weight="bold">source_type</text>
  <text x="20" y="424" font-size="9" fill="#6272a4">arxiv | pdf | url | code_output | tool_call |</text>
  <text x="20" y="438" font-size="9" fill="#6272a4">bash_log | memory_card | user_upload |</text>
  <text x="20" y="452" font-size="9" fill="#6272a4">experiment_result | dataset | literature_review</text>

  <text x="20" y="476" font-size="10" fill="#ff79c6" font-weight="bold">source_excerpt</text>
  <text x="20" y="492" font-size="9" fill="#ff5555">REQUIRED for supported &amp; inferred levels</text>
  <text x="20" y="506" font-size="9" fill="#6272a4">Enables independent NLI fact-checking</text>
</svg>
