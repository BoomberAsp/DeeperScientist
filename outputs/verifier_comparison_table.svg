<svg xmlns="http://www.w3.org/2000/svg" width="620" height="260" font-family="Segoe UI, Arial, sans-serif">
  <!-- Card background -->
  <rect x="0" y="0" width="620" height="260" rx="8" fill="#1e1e2e"/>
  <rect x="0" y="0" width="620" height="260" rx="8" fill="none" stroke="#44475a" stroke-width="1.5"/>

  <!-- Title -->
  <text x="20" y="30" font-size="14" fill="#ffffff" font-weight="bold">Agent Self-Label vs External NLI Verifier</text>

  <!-- Table header row -->
  <rect x="20" y="42" width="580" height="28" rx="4" fill="#44475a"/>
  <text x="30" y="61" font-size="11" fill="#ffffff" font-weight="bold">Evidence</text>
  <text x="150" y="61" font-size="11" fill="#ffffff" font-weight="bold">Agent Label</text>
  <text x="280" y="61" font-size="11" fill="#ffffff" font-weight="bold">NLI Verdict</text>
  <text x="425" y="61" font-size="11" fill="#ffffff" font-weight="bold">Score</text>
  <text x="510" y="61" font-size="11" fill="#ffffff" font-weight="bold">Interpretation</text>

  <!-- Row 1 -->
  <text x="30" y="95" font-size="11" fill="#f8f8f2">EVD-0c8841da-001</text>
  <rect x="140" y="82" width="85" height="20" rx="3" fill="#50fa7b33" stroke="#50fa7b" stroke-width="1"/>
  <text x="150" y="96" font-size="10" fill="#50fa7b">supported</text>
  <rect x="270" y="82" width="85" height="20" rx="3" fill="#50fa7b33" stroke="#50fa7b" stroke-width="1"/>
  <text x="278" y="96" font-size="10" fill="#50fa7b">entailment</text>
  <text x="435" y="96" font-size="11" fill="#50fa7b">1.000</text>
  <text x="510" y="96" font-size="11" fill="#50fa7b">✓ Match</text>

  <!-- Row 2 (illustrative) -->
  <text x="30" y="131" font-size="11" fill="#f8f8f2">EVD-example-002</text>
  <rect x="140" y="117" width="85" height="20" rx="3" fill="#50fa7b33" stroke="#50fa7b" stroke-width="1"/>
  <text x="150" y="131" font-size="10" fill="#50fa7b">supported</text>
  <rect x="270" y="117" width="85" height="20" rx="3" fill="#ffb86c33" stroke="#ffb86c" stroke-width="1"/>
  <text x="278" y="131" font-size="10" fill="#ffb86c">neutral</text>
  <text x="435" y="131" font-size="11" fill="#ffb86c">0.520</text>
  <text x="510" y="131" font-size="11" fill="#ffb86c">⚠ Overclaim</text>

  <!-- Row 3 (illustrative) -->
  <text x="30" y="167" font-size="11" fill="#f8f8f2">EVD-example-003</text>
  <rect x="140" y="153" width="85" height="20" rx="3" fill="#50fa7b33" stroke="#50fa7b" stroke-width="1"/>
  <text x="150" y="167" font-size="10" fill="#50fa7b">inferred</text>
  <rect x="270" y="153" width="85" height="20" rx="3" fill="#ff555533" stroke="#ff5555" stroke-width="1"/>
  <text x="278" y="167" font-size="10" fill="#ff5555">contradiction</text>
  <text x="435" y="167" font-size="11" fill="#ff5555">0.001</text>
  <text x="510" y="167" font-size="11" fill="#ff5555">✗ Conflict</text>

  <!-- Row 4 (illustrative) -->
  <text x="30" y="203" font-size="11" fill="#f8f8f2">EVD-example-004</text>
  <rect x="140" y="189" width="85" height="20" rx="3" fill="#ffb86c33" stroke="#ffb86c" stroke-width="1"/>
  <text x="150" y="203" font-size="10" fill="#ffb86c">insufficient</text>
  <rect x="270" y="189" width="85" height="20" rx="3" fill="#6272a433" stroke="#6272a4" stroke-width="1"/>
  <text x="278" y="203" font-size="10" fill="#6272a4">unverifiable</text>
  <text x="435" y="203" font-size="11" fill="#6272a4">—</text>
  <text x="510" y="203" font-size="11" fill="#6272a4">— Missing excerpt</text>

  <!-- Key insight -->
  <text x="20" y="245" font-size="10" fill="#6272a4">
    Agent self-assessment is optimistic. External NLI catches overclaims, contradictions, and missing evidence.
  </text>
</svg>
